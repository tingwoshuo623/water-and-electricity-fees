function readRechargeAmount(form) {
  if (!form) return 0;
  const customInput = form.querySelector('#recharge-custom');
  const customValue = String(customInput ? customInput.value : '').trim();
  if (customValue !== '') {
    const parsed = Number(customValue);
    return Number.isFinite(parsed) ? round2(parsed) : 0;
  }
  const active = form.querySelector('.amount-chip.is-active');
  return active ? Number(active.dataset.amount) : 0;
}

function updateRechargeSummary(form = document.getElementById('recharge-form')) {
  if (!form || !form.isConnected) return;
  const amount = readRechargeAmount(form);
  const valid = amount >= 1 && amount <= 5000;
  const summaryAmount = form.querySelector('#summary-amount');
  const summaryTotal = form.querySelector('#summary-total');
  const submit = form.querySelector('#recharge-submit');
  if (summaryAmount) summaryAmount.textContent = valid ? money(amount) : '—';
  if (summaryTotal) summaryTotal.textContent = valid ? money(amount) : '—';
  if (submit) submit.innerHTML = valid ? `确认支付 ${money(amount)}` : '确认支付';
}

function updateRechargeAccountHint(select) {
  if (!select) return;
  const account = getAccount(select.value);
  const hint = document.getElementById('recharge-balance-hint');
  if (!account || !hint) return;
  hint.textContent = `当前余额 ${money(account.balance)}${isLow(account) ? ' · 余额偏低' : ''}`;
  hint.classList.toggle('is-low', isLow(account));
}

function genOrderNo() {
  const date = new Date();
  const prefix = `QH${date.getFullYear()}${pad2(date.getMonth() + 1)}${pad2(date.getDate())}`;
  let suffix;
  do {
    suffix = String(Math.floor(100000 + Math.random() * 900000));
  } while (state.orders.some((order) => order.orderNo === prefix + suffix));
  return prefix + suffix;
}

function handleRechargeSubmit(form) {
  const amount = readRechargeAmount(form);
  const accountId = form.elements.accountId.value;
  const account = getAccount(accountId);
  const methodInput = form.querySelector('input[name="payment"]:checked');
  const method = methodInput ? methodInput.value : 'wechat';
  setFieldError(form, 'amount', '');

  if (!account) {
    setFieldError(form, 'amount', '请选择一个有效的充值寝室');
    return;
  }
  if (!Number.isFinite(amount) || amount < 1 || amount > 5000) {
    setFieldError(form, 'amount', '请输入 ¥1–¥5000 之间的充值金额');
    const custom = form.querySelector('#recharge-custom');
    if (custom) custom.focus();
    return;
  }

  const submit = form.querySelector('#recharge-submit');
  setButtonBusy(submit, '正在发起支付…');
  const epoch = stateEpoch;

  window.setTimeout(() => {
    if (epoch !== stateEpoch) return;
    createRechargeOrder({ accountId, amount, method, epoch });
  }, 620);
}

function createRechargeOrder({ accountId, amount, method, epoch }) {
  const order = {
    orderNo: genOrderNo(),
    accountId,
    amount: round2(amount),
    method,
    status: 'processing',
    createdAt: Date.now(),
    paidAt: null,
    syncedAt: null,
    failReason: '',
    syncing: false
  };
  state.orders.unshift(order);
  state.orderFilter = 'all';
  renderDashboard();
  showPaymentModal(order, { focus: true });
  toast('支付请求已提交，请稍候', 'info', 2400);

  window.setTimeout(() => {
    if (epoch !== stateEpoch) return;
    if (order.status !== 'processing') return;
    order.status = 'pending_sync';
    order.paidAt = Date.now();
    renderDashboard();
    refreshOpenOrderModal(order);
    toast('支付成功，正在同步到账', 'info', 2600);
  }, 1250);

  window.setTimeout(() => {
    if (epoch !== stateEpoch) return;
    if (order.status !== 'pending_sync') return;
    completeOrder(order.orderNo, { silent: false });
  }, 3750);
}

function paymentOrbit(order) {
  if (order.status === 'processing') {
    return '<div class="status-orbit processing" aria-hidden="true"><span class="spinner-ring"></span></div>';
  }
  if (order.status === 'pending_sync') {
    return `<div class="status-orbit pending" aria-hidden="true">${order.syncing ? '<span class="spinner-ring"></span>' : ICONS.sync}</div>`;
  }
  if (order.status === 'failed') {
    return `<div class="status-orbit failed" aria-hidden="true">${ICONS.x}</div>`;
  }
  return `<div class="status-orbit success" aria-hidden="true">${ICONS.check}</div>`;
}

function paymentBodyHTML(order) {
  const account = getAccount(order.accountId);
  const accountName = account ? account.alias : '已解绑寝室';
  let title = '正在安全支付';
  let description = '正在连接支付通道，请稍候。支付结果会自动更新到订单列表。';
  if (order.status === 'pending_sync') {
    title = '支付成功，正在同步';
    description = '款项已支付，正在写入你的宿舍水电账户，通常 1 分钟内到账。';
  } else if (order.status === 'success') {
    title = '充值已到账';
    description = '充值金额已计入寝室余额，可继续查看订单或完成本次操作。';
  } else if (order.status === 'failed') {
    title = '支付未完成';
    description = order.failReason || '支付没有完成，请重新发起充值。';
  }

  const successNote = order.status === 'success'
    ? `<div class="status-note success">${ICONS.check}<span>${money(order.amount)} 已同步至 <strong>${escapeHTML(accountName)}</strong>${account ? `，当前余额 ${money(account.balance)}` : ''}。</span></div>`
    : order.status === 'pending_sync'
      ? `<div class="status-note pending">${ICONS.sync}<span>正在同步至宿舍水电账户，到账后余额会自动更新。无需重复支付。</span></div>`
      : '';

  const actions = order.status === 'processing'
    ? `<div class="payment-actions"><button type="button" class="btn btn-ghost" data-action="close-modal">返回</button></div>
       <p class="payment-footnote">你可以关闭该窗口，支付结果会继续在订单列表中更新。</p>`
    : order.status === 'pending_sync'
      ? `<div class="payment-actions">
           <button type="button" class="btn btn-ghost" data-action="view-order" data-order-no="${escapeHTML(order.orderNo)}">查看订单</button>
           <button type="button" class="btn btn-primary" data-action="close-modal">完成</button>
         </div>`
      : `<div class="payment-actions">
           <button type="button" class="btn btn-ghost" data-action="view-order" data-order-no="${escapeHTML(order.orderNo)}">查看订单</button>
           <button type="button" class="btn btn-primary" data-action="close-modal">完成</button>
         </div>`;

  return `
    <div class="payment-view">
      ${paymentOrbit(order)}
      <h2>${title}</h2>
      <p class="payment-desc">${description}</p>
      <div class="payment-amount">${money(order.amount)}</div>
      <div class="payment-receipt">
        <div class="receipt-row"><span>充值寝室</span><strong>${escapeHTML(accountName)}</strong></div>
        <div class="receipt-row"><span>支付方式</span><strong>${methodLabel(order.method)}</strong></div>
        <div class="receipt-row"><span>订单编号</span><strong class="mono">${escapeHTML(order.orderNo)}</strong></div>
      </div>
      ${successNote}
      ${actions}
    </div>
  `;
}

function showPaymentModal(order, { focus = true } = {}) {
  const content = modalShell({
    kicker: 'Secure payment',
    title: '充值支付',
    subtitle: '',
    body: `<div class="modal-body" data-payment-order="${escapeHTML(order.orderNo)}">${paymentBodyHTML(order)}</div>`,
    size: 'sm'
  });
  showModal(content, { type: 'payment', orderNo: order.orderNo }, { focus });
}

function refreshOpenOrderModal(order) {
  if (!modalOpen) return;
  if (currentModal && (currentModal.type === 'order' || currentModal.type === 'payment') && currentModal.orderNo === order.orderNo) {
    const body = currentModal.type === 'payment'
      ? paymentBodyHTML(order)
      : orderDetailBodyHTML(order);
    setModalBody(body, currentModal);
  }
}

/* ---------------------------- Order completion / sync ---------------------------- */

function creditOrder(order) {
  const account = getAccount(order.accountId);
  if (!account || order.credited) return;
  account.balance = round2(Number(account.balance) + Number(order.amount));
  account.lastUpdated = Date.now();
  order.credited = true;
  if (!isLow(account)) {
    if (lastLowAlertAccountId === account.id) hideLowAlert(account.id);
  }
}

function completeOrder(orderNo, { silent = false } = {}) {
  const order = getOrder(orderNo);
  if (!order || order.status !== 'pending_sync') return;
  order.status = 'success';
  order.syncedAt = Date.now();
  order.syncing = false;
  creditOrder(order);
  state.lastSync = Date.now();
  renderDashboard();
  refreshOpenOrderModal(order);
  if (!silent) toast(`充值到账 · ${money(order.amount)}`, 'success');
}

function syncOrder(orderNo, { silent = false, onDone = null } = {}) {
  const order = getOrder(orderNo);
  if (!order || order.status !== 'pending_sync' || order.syncing) {
    if (typeof onDone === 'function') onDone();
    return;
  }
  order.syncing = true;
  renderDashboard();
  refreshOpenOrderModal(order);
  setNetStatus('loading', '同步中');
  const epoch = stateEpoch;

  window.setTimeout(() => {
    if (epoch !== stateEpoch) return;
    order.syncing = false;
    completeOrder(orderNo, { silent });
    setNetStatus('ok', '服务正常');
    if (typeof onDone === 'function') onDone();
  }, 1550);
}

function syncAllPending() {
  const pending = pendingOrders().filter((order) => !order.syncing);
  if (!pending.length) {
    toast('当前没有待同步的订单', 'info');
    return;
  }
  const total = pending.length;
  let remaining = total;
  const notify = () => {
    remaining -= 1;
    if (remaining === 0) toast(`${total} 笔充值已全部同步到账`, 'success');
  };
  pending.forEach((order, index) => {
    window.setTimeout(() => {
      syncOrder(order.orderNo, { silent: true, onDone: notify });
    }, index * 220);
  });
}

/* ---------------------------- Refreshing ---------------------------- */

function refreshAccount(accountId) {
  const account = getAccount(accountId);
  if (!account || account.refreshing) return;
  account.refreshing = true;
  renderDashboard();
  setNetStatus('loading', '查询中');
  const epoch = stateEpoch;
  window.setTimeout(() => {
    if (epoch !== stateEpoch) return;
    account.refreshing = false;
    account.lastUpdated = Date.now();
    state.lastSync = Date.now();
    renderDashboard();
    setNetStatus('ok', '服务正常');
    toast('余额已更新', 'success');
  }, 850);
}

function refreshAll() {
  if (state.accounts.some((account) => account.refreshing)) return;
  state.accounts.forEach((account) => { account.refreshing = true; });
  renderDashboard();
  setNetStatus('loading', '同步中');
  const epoch = stateEpoch;
  window.setTimeout(() => {
    if (epoch !== stateEpoch) return;
    state.accounts.forEach((account) => {
      account.refreshing = false;
      account.lastUpdated = Date.now();
    });
    state.lastSync = Date.now();
    renderDashboard();
    setNetStatus('ok', '服务正常');
    toast('全部寝室数据已更新', 'success');
    const button = view.querySelector('[data-action="refresh-all"]');
    if (button) button.focus({ preventScroll: true });
  }, 920);
}

/* ---------------------------- Event handling ---------------------------- */

function handleAction(event) {
  const target = event.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;
  if (!action) return;

  switch (action) {
    case 'scroll-top':
      event.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      break;
    case 'scroll-orders':
      event.preventDefault();
      if (viewState !== 'ready') return;
      document.getElementById('orders')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      break;
    case 'bind-account':
      openBindModal();
      break;
    case 'close-modal':
      closeModal();
      break;
    case 'dismiss-low':
      dismissLowAlert(target.dataset.id || lastLowAlertAccountId);
      break;
    case 'low-recharge': {
      const account = getAccount(target.dataset.id);
      if (!account) break;
      hideLowAlert(account.id);
      openRecharge(account.id, suggestedRecharge(account));
      break;
    }
    case 'recharge': {
      const account = getAccount(target.dataset.id);
      if (!account) break;
      openRecharge(account.id, isLow(account) ? suggestedRecharge(account) : 100);
      break;
    }
    case 'recharge-again': {
      const account = getAccount(target.dataset.id);
      if (!account) {
        closeModal();
        openRecharge(state.accounts[0]?.id || '', 100);
        break;
      }
      openRecharge(account.id, 100);
      break;
    }
    case 'open-bills':
      openBills(target.dataset.id);
      break;
    case 'edit-threshold':
      openThresholdModal(target.dataset.id);
      break;
    case 'refresh-account':
      refreshAccount(target.dataset.id);
      break;
    case 'refresh-all':
      refreshAll();
      break;
    case 'filter-orders':
      setOrderFilter(target.dataset.filter);
      break;
    case 'goto-pending':
      state.orderFilter = 'pending';
      renderDashboard();
      document.getElementById('orders')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      break;
    case 'sync-all':
      syncAllPending();
      break;
    case 'sync-order':
      if (target.dataset.orderNo) syncOrder(target.dataset.orderNo);
      break;
    case 'open-order':
      if (target.dataset.orderNo) openOrderDetail(target.dataset.orderNo);
      break;
    case 'view-order':
      if (target.dataset.orderNo) openOrderDetail(target.dataset.orderNo);
      break;
    case 'retry-order': {
      const order = getOrder(target.dataset.orderNo);
      if (!order) break;
      closeModal();
      openRecharge(order.accountId, order.amount);
      break;
    }
    case 'choose-amount': {
      const form = target.closest('#recharge-form');
      if (!form) break;
      form.querySelectorAll('.amount-chip').forEach((chip) => {
        const active = chip === target;
        chip.classList.toggle('is-active', active);
        chip.setAttribute('aria-pressed', String(active));
      });
      const custom = form.querySelector('#recharge-custom');
      if (custom) custom.value = '';
      setFieldError(form, 'amount', '');
      updateRechargeSummary(form);
      break;
    }
    case 'reload-bills':
      reloadBills(target.dataset.id);
      break;
    case 'network-info': {
      if (viewState === 'error') {
        toast('服务连接异常，请重新加载页面', 'danger');
      } else {
        toast(`服务连接正常 · 最近同步 ${relativeTime(state.lastSync)}`, 'info');
      }
      break;
    }
    case 'open-help':
      event.preventDefault();
      openHelpModal();
      break;
    case 'open-state-preview':
      openStatePreview();
      break;
    case 'preview-loading':
      closeModal();
      boot({ delay: 1800, showLow: false });
      toast('正在预览加载状态', 'info', 1900);
      break;
    case 'preview-error':
      closeModal();
      boot({ delay: 850, fail: true, showLow: false });
      break;
    case 'preview-pending':
      previewPending();
      break;
    case 'preview-low':
      previewLow();
      break;
    case 'reset-demo':
      resetDemo();
      break;
    case 'retry-boot':
      boot({ delay: 720, showLow: false });
      break;
    default:
      break;
  }
}

function setOrderFilter(filter) {
  state.orderFilter = filter;
  document.querySelectorAll('.tab[data-action="filter-orders"]').forEach((tab) => {
    const active = tab.dataset.filter === filter;
    tab.classList.toggle('is-active', active);
    tab.setAttribute('aria-selected', String(active));
  });
  const list = document.getElementById('order-list-mount');
  if (list) list.innerHTML = orderRowsHTML();
}

function handleSubmit(event) {
  const form = event.target;
  if (!(form instanceof HTMLFormElement)) return;

  if (form.id === 'bind-form') {
    event.preventDefault();
    handleBindSubmit(form);
    return;
  }
  if (form.id === 'threshold-form') {
    event.preventDefault();
    handleThresholdSubmit(form);
    return;
  }
  if (form.id === 'recharge-form') {
    event.preventDefault();
    handleRechargeSubmit(form);
  }
}

function handleInput(event) {
  const target = event.target;
  if (!(target instanceof HTMLElement)) return;

  if (target.id === 'bind-account-no') {
    const digits = target.value.replace(/\D/g, '').slice(0, 16);
    if (target.value !== digits) target.value = digits;
  }

  const field = target.closest('.field');
  if (field && field.classList.contains('has-error')) {
    field.classList.remove('has-error');
    const error = field.querySelector('.field-error');
    if (error) error.textContent = '';
  }

  if (target.id === 'recharge-custom') {
    const form = target.closest('#recharge-form');
    if (form && target.value.trim() !== '') {
      form.querySelectorAll('.amount-chip').forEach((chip) => {
        chip.classList.remove('is-active');
        chip.setAttribute('aria-pressed', 'false');
      });
    }
    updateRechargeSummary(form);
  }

  if (target.id === 'bind-threshold') {
    target.dataset.touched = 'true';
  }
}

function handleChange(event) {
  const target = event.target;
  if (!(target instanceof HTMLElement)) return;

  if (target.name === 'type' && target.closest('#bind-form')) {
    const form = target.closest('#bind-form');
    const isWater = target.value === 'water';
    const threshold = form.querySelector('#bind-threshold');
    const accountInput = form.querySelector('#bind-account-no');
    if (threshold && !threshold.dataset.touched) {
      threshold.value = isWater ? '30' : '50';
      threshold.dataset.defaultThreshold = isWater ? 'water' : 'electricity';
    }
    if (accountInput) {
      accountInput.placeholder = isWater ? '例如 880021456632' : '例如 320188450971';
    }
    setFieldError(form, 'accountNo', '');
    return;
  }

  if (target.id === 'recharge-account') {
    updateRechargeAccountHint(target);
    return;
  }

  if (target.id === 'recharge-custom') {
    updateRechargeSummary(target.closest('#recharge-form'));
  }
}

function bindEvents() {
  document.addEventListener('click', handleAction);
  document.addEventListener('submit', handleSubmit);
  document.addEventListener('input', handleInput);
  document.addEventListener('change', handleChange);

  window.addEventListener('offline', () => {
    setNetStatus('error', '网络已断开');
    toast('网络连接已断开，请检查网络后重试', 'danger', 3800);
  });
  window.addEventListener('online', () => {
    setNetStatus('ok', '服务正常');
    toast('网络连接已恢复', 'success');
  });
}

/* ---------------------------- Init ---------------------------- */

bindEvents();
renderSkeleton();
boot({ delay: 900, showLow: true });
</script>
</body>
</html>
